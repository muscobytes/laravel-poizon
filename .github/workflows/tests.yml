name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            laravel: '12'
            testbench: '^10.0'
          - php: '8.4'
            laravel: '12'
            testbench: '^10.0'
          - php: '8.3'
            laravel: '13'
            testbench: '^11.0'
          - php: '8.5'
            laravel: '13'
            testbench: '^11.0'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, mbstring, dom, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: composer update --with "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --prefer-dist --no-progress
      - run: composer lint
      - run: composer test
      - run: php tests/smoke.php
        env:
          LARAVEL_VERSION: ${{ matrix.laravel }}
